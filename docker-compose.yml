services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: opsmate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opsmate}
      POSTGRES_USER: ${POSTGRES_USER:-opsmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsmate}
    ports:
      - "5434:5432"
    volumes:
      - opsmate-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opsmate} -d ${POSTGRES_DB:-opsmate}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opsmate-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-opsmate}
      DB_USER: ${POSTGRES_USER:-opsmate}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-opsmate}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:8b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-120000}
      STEP_TIMEOUT_MS: ${STEP_TIMEOUT_MS:-60000}
      AGENT_MAX_ITERATIONS: ${AGENT_MAX_ITERATIONS:-10}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opsmate-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8084
    ports:
      - "5177:5177"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5177 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  sim-env:
    build:
      context: ./sim-env
      dockerfile: Dockerfile
    container_name: opsmate-sim-env
    restart: unless-stopped
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8100/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  opsmate-pgdata: