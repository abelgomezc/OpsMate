spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

opsmate:
  llm:
    timeout-ms: 5000
  step:
    timeout-ms: 5000
  agent:
    max-iterations: 5
  case:
    timeout-minutes: 1
  watchdog:
    enabled: true
    timeout-minutes: 1