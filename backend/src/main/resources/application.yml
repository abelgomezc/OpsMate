server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: opsmate-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/opsmate}
    username: ${DB_USER:opsmate}
    password: ${DB_PASSWORD:opsmate}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://host.docker.internal:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:qwen3:8b}
          temperature: 0.2
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

  # Timeout global de llamada al LLM (ms). Configurable por entorno.
opsmate:
  llm:
    timeout-ms: ${LLM_TIMEOUT_MS:120000}
  step:
    timeout-ms: ${STEP_TIMEOUT_MS:60000}
  agent:
    max-iterations: ${AGENT_MAX_ITERATIONS:10}
  case:
    timeout-minutes: ${CASE_TIMEOUT_MINUTES:10}
  watchdog:
    timeout-minutes: ${WATCHDOG_TIMEOUT_MINUTES:5}
    interval-seconds: ${WATCHDOG_INTERVAL_SECONDS:30}
    restart-recovery: ${WATCHDOG_RESTART_RECOVERY:true}
  systems:
    dir: ${SYSTEMS_DIR:systems}
  action:
    dry-run: ${ACTION_DRY_RUN:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.opsmate: DEBUG